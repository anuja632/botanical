<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>100% Natural Ingredients</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #ffffff;
    font-family: Arial, sans-serif;
  }

  .badge {
    width: 300px;
    height: 300px;
  }

  .leaf {
    position: absolute;
    width: 180px;
    left: 50%;
    top: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  svg {
    width: 100%;
    height: 100%;
  }

  text {
    font-size: 14px;
    letter-spacing: 3px;
    fill: #222;
  }
</style>
</head>

<body>

<div class="badge">
  <svg viewBox="0 0 300 300">

    <!-- Outer Circle -->
    <circle cx="150" cy="150" r="130" fill="none" stroke="#222" stroke-width="2"/>

    <!-- Top Curve -->
    <path id="topCurve" d="M 40 150 A 110 110 0 0 1 260 150" fill="none"/>

    <!-- Bottom Curve -->
    <path id="bottomCurve" d="M 40 150 A 110 110 0 0 0 260 150" fill="none"/>

    <!-- Top Text -->
    <text>
      <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
        100% NATURAL
      </textPath>
    </text>

    <!-- Bottom Text -->
    <text>
      <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
        INGREDIENTS
      </textPath>
    </text>

  </svg>

  <!-- Center Image -->
  <img class="leaf" src="https://img.freepik.com/premium-psd/medicinal-herbs-mortar-illustration-isolated-transparent-background_979495-150680.jpg?uid=R208066470&ga=GA1.1.1679070017.1753435898&semt=ais_hybrid&w=740&q=80" alt="Leaf">
</div>

<script>
  // Optional hover effect
  const badge = document.querySelector('.badge');

  badge.addEventListener('mouseenter', () => {
    badge.style.transform = 'scale(1.05)';
    badge.style.transition = '0.3s ease';
  });

  badge.addEventListener('mouseleave', () => {
    badge.style.transform = 'scale(1)';
